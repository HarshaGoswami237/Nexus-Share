<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Share</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrapper">
    <!-- Top Clean Header -->
    <header class="header">
        <div class="brand-group">
            <span class="status-dot"></span>
            <span class="brand-name">Nexus Share</span>
        </div>
        <div class="file-badge">{{COUNT}} Files</div>
    </header>

    <!-- File List Container -->
    <main class="file-card">
        <div class="file-list">
            {{FILE_ROWS}}
        </div>
    </main>
</div>
</body>
</html>
